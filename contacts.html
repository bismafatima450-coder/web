<style>
  /* ===== CONTACT.CSS -===== */
@import url('https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:wght@400;700;900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
font-family: "Lobster Two", sans-serif;}

body {
  background: #0a0a0f;
  color: #fff;
  font-family: 'Poppins', Arial, sans-serif;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 60%),
    radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.15) 0%, transparent 60%);
}

/* ===== NAVBAR -===== */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 60px;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(15px);
  border-bottom: 2px solid #8a2be2;
  box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
}

nav h2 {
  font-family: "Lobster Two", sans-serif;
  color: #8a2be2;
  text-shadow: 0 0 10px #8a2be2, 0 0 20px #8a2be2, 0 0 40px #00ffff;
  font-size: 28px;
  font-weight: 700;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 30px;
  list-style: none;
}

nav ul li a {
  font-family: "Lobster Two", sans-serif;
  text-decoration: none;
  color: #ccddff;
  font-weight: 700;
  font-size: 18px;
  transition: 0.3s;
}

nav ul li a:hover {
  color: #fff;
  text-shadow: 0 0 15px #00ffff;
}

nav ul li a.active {
  color: #00ffff;
  text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
}

/* ===== CONTACT SECTION ===== */
.contact-section {
  padding: 80px 20px;
  text-align: center;
  max-width: 1200px;
  margin: auto;
  
}

.contact-section h1 {
  font-family: "Lobster Two", sans-serif;
  font-size: 55px;
  color: #e0f7ff; /* LIGHT CYAN */
  text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #8a2be2;
  margin-bottom: 15px;
font-weight: 900;
}

.contact-section > p {
  font-family: "Lobster Two", sans-serif;
  color: #ccddff;
  font-size: 20px;
  margin-bottom: 70px;
  text-shadow: 0 0 8px #8a2be2, 0 0 15px #00ffff;
}

/* ===== CONTACT GRID ===== */
.contact-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 40px;
}

/* ===== GLASSMORPHISM CARD ===== */
.contact-card {
  background: rgba(0, 255, 255, 0.05);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(138, 43, 226, 0.3);
  border-radius: 25px;
  padding: 40px;
  box-shadow: 0 8px 32px 0 rgba(138, 43, 226, 0.2);
  transition: 0.5s ease;
  transform: rotateY(-3deg) rotateX(3deg);
  text-align: left;
}

.contact-card:hover {
  transform: rotateY(0deg) rotateX(0deg) translateY(-10px) scale(1.02);
  box-shadow: 0 15px 60px 0 rgba(0, 255, 255, 0.7), 0 0 30px rgba(138, 43, 226, 0.5);
  border: 1px solid rgba(0, 255, 255, 0.9);
}

.contact-card h3 {
  font-family: "Lobster Two", sans-serif;
  color: #00ffff;
  text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
  font-size: 28px;
  margin-bottom: 25px;
  font-weight: 700;
}

/* ===== INPUTS ===== */
.input-group {
  position: relative;
  margin-bottom: 20px;
}

.input-group i {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #00ffff;
  font-size: 18px;
  text-shadow: 0 0 10px #00ffff;
}

.input-group textarea ~ i {
  top: 20px;
  transform: none;
}

.input-group input,
.input-group textarea {
  width: 100%;
  padding: 15px 15px 15px 45px;
  background: rgba(138, 43, 226, 0.1);
  border: 2px solid rgba(0, 255, 255, 0.3);
  border-radius: 12px;
  color: #fff;
  font-family: "Lobster Two", sans-serif;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}

.input-group input:focus,
.input-group textarea:focus {
  border: 2px solid #00ffff;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
  background: rgba(138, 43, 226, 0.2);
}

.input-group input::placeholder,
.input-group textarea::placeholder {
  color: #aabbee;
}

/* ===== NEON BUTTON ===== */
.neon-btn {
  font-family: "Lobster Two", sans-serif;
  width: 100%;
  padding: 15px;
  background: linear-gradient(90deg, #8a2be2, #00ffff);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.4s;
  box-shadow: 0 0 15px rgba(138, 43, 226, 0.5), 0 0 30px rgba(0, 255, 255, 0.5);
}

.neon-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px #8a2be2, 0 0 50px #00ffff;
  letter-spacing: 2px;
}

/* ===== CONTACT INFO ===== */
.info-item {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.info-item i {
  font-size: 22px;
  color: #00ffff;
  text-shadow: 0 0 10px #00ffff;
}

.info-item p {
  font-family: "Lobster Two", sans-serif;
  font-size: 18px;
  color: #ddf5ff;
}

/* ===== SOCIAL ICONS ===== */
.social-icons {
  display: flex;
  gap: 20px;
}

.social-icons a {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(138, 43, 226, 0.2);
  border: 2px solid rgba(0, 255, 255, 0.5);
  border-radius: 50%;
  color: #00ffff;
  font-size: 22px;
  transition: 0.3s;
  text-shadow: 0 0 10px #00ffff;
}

.social-icons a:hover {
  background: linear-gradient(135deg, #8a2be2, #00ffff);
  color: #fff;
  transform: translateY(-5px) rotate(10deg);
  box-shadow: 0 0 20px #00ffff;
}

/* ===== FOOTER ===== */
footer {
  font-family: "Lobster Two", sans-serif;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(15px);
  border-top: 2px solid #00ffff;
  text-align: center;
  padding: 25px;
  margin-top: 80px;
  box-shadow: 0 -5px 30px rgba(0, 255, 255, 0.6);
}

footer p {
  color: #00ffff;
  font-size: 16px;
  text-shadow: 0 0 10px #00ffff, 0 0 20px #8a2be2;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {

  display: flex;

}



/*2 LINE DOTS */
nav div li {

}

body {

/* ===== NAVBAR FOR LEARN WITH BISMA ===== */

}

.logo {

}

/* Hide checkbox */
#menu-toggle { display: none; }

/* Hamburger - RIGHT CORNER */
/* Hamburger - RIGHT CORNER - FIXED */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  gap: 6px;
  margin-left: auto;
  z-index: 1002; 
  padding: 8px;
  /* click area bara */

    position: fixed; 
  top: 15px;      
  right: 20px;    
  display: none;
}
.hamburger span {
  width: 30px;
  height: 4px; 
  background: #0ff;
  border-radius: 4px;
  transition: 0.4s;
  box-shadow: 0 0 8px #0ff, 0 0 15px #0ff; /* neon glow double */
  display: block;
}
/* Desktop Menu - RIGHT SIDE */
.nav-menu {
  display: flex;
  list-style: none;
  gap: 30px;
  margin-left: auto;
}

  

.nav-menu a {
  color: white;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  transition: 0.3s;}
  
.nav-menu a:hover, 
.nav-menu a.active {
  color: #0ff;
  text-shadow: 0 0 10px #0ff;
}


/* ===== MOBILE VIEW - SIDE SLIDE MENU FIXED ===== */
@media (max-width: 768px) {
  body { padding-top: 60px; }
  
  .hamburger { display: flex; }
  
  .nav-menu {
    position: fixed;
    top: 60px;
    right: -100%;
    flex-direction: column;
    background: #0a0a0a;
    width: 70%; 
    height: calc(100vh - 60px);
    text-align: left;
    padding: 40px 30px;
    gap: 25px;
    transition: 0.4s ease;
    border-left: 2px solid #0ff;
    margin-left: 0;
    z-index: 1000; 
    overflow-y: auto; 
  }
  
  /* JAB CLICK HOGA TO ANDAR AAYEGA */
  #menu-toggle:checked ~ .nav-menu { 
    right: 0; 
    box-shadow: -5px 0 20px rgba(0, 255, 255, 0.3); /* side shadow */
  }
  
  /* 3 LINE X BANANA */
  #menu-toggle:checked ~ .hamburger span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
  #menu-toggle:checked ~ .hamburger span:nth-child(2) { opacity: 0; }
  #menu-toggle:checked ~ .hamburger span:nth-child(3) { transform: rotate(-45deg) translate(7px, -6px); }
}


/* Mobile Responsive */
@media (max-width: 768px) {
  .contact-info { text-align: center; }
  .social-links { justify-content: center; }
}


</style>
